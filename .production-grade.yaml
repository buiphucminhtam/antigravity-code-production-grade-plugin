# Senior is the default competence/communication baseline for every role.
codingLevel: 8

expertMode:
  enabled: true
  activeCli: "codex"
  fallbackCli: null
  useFor:
    planning: false
    failedPlanReview: true
    gates: true
    securityReview: true
    architectureReview: true
    codeReview: true
  budget:
    maxExpertCallsPerRun: 12
    requireConfirmationAbove: 3

# Native Codex subagent routing. These values are preferences; apply them only
# when the active spawn_agent schema advertises the exact model and effort.
subagents:
  codex:
    default:
      model: "gpt-5.6-luna"
      reasoning_effort: "high"
    tiers: {}
    agent_types: {}

token_tracking:
  enabled: true
  log_dir: "~/.forgewright/usage"
  export_format: jsonl
