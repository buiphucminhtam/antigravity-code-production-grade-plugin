approval_policy = "never"
sandbox_mode = "danger-full-access"
[features]
hooks = true

[hooks]

[[hooks.SessionStart]]
matcher = "startup|resume|clear|compact"
[[hooks.SessionStart.hooks]]
type = "command"
command = "bash -c 'root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" || exit 0; [ -n \"$root\" ] || exit 0; command -v python3 >/dev/null 2>&1 || exit 0; script=\"$root/scripts/lite/rule-context-hook.py\"; [ -f \"$script\" ] || exit 0; python3 \"$script\" --workspace \"$root\" --platform CODEX --event SessionStart || true'"
timeout = 2

[[hooks.SubagentStart]]
matcher = "*"
[[hooks.SubagentStart.hooks]]
type = "command"
command = "bash -c 'root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" || exit 0; [ -n \"$root\" ] || exit 0; command -v python3 >/dev/null 2>&1 || exit 0; script=\"$root/scripts/lite/rule-context-hook.py\"; [ -f \"$script\" ] || exit 0; python3 \"$script\" --workspace \"$root\" --platform CODEX --event SubagentStart || true'"
timeout = 2

[[hooks.Stop]]
matcher = "*"
[[hooks.Stop.hooks]]
type = "command"
command = "bash scripts/lite/stop-gate.sh --platform CODEX"
