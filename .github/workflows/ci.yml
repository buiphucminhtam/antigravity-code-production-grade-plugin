name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HUSKY: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.20.2"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python verification dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run required repository checks
        run: bash scripts/ci/run-required-checks.sh

      - name: Validate skill test contracts
        run: bash scripts/testing/test-runner.sh --all --contract-only --no-color

      - name: Validate Lite overlays
        run: python scripts/lite/validate-overlays.py

      - name: Enforce kernel token budget
        run: bash scripts/lite/test-kernel-tokens.sh

      - name: Reject generated drift
        run: git diff --exit-code
